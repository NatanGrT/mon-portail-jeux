<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Barrière Elite - Blackjack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header>
            <a href="../../index.html" class="back-link">← Retour</a>
            <h1>Barrière <span>Elite</span></h1>
        </header>

        <div class="stats-panel">
            <div class="stat-box">SOLDE: <span id="balance">1000</span>€</div>
            <div class="stat-box win-total">GAIN: <span id="last-win">0</span>€</div>
            <div id="status-label" class="stat-box status-msg">FAITES VOS JEUX</div>
        </div>

        <div class="blackjack-table">
            <div class="dealer-section">
                <div id="dealer-cards" class="hand"></div>
                <div class="score-badge" id="dealer-score-badge">0</div>
            </div>

            <div class="table-center">
                <div class="logo-b">B</div>
                <div class="rules">LE CROUPIER RESTE À 17</div>
            </div>

            <div class="player-section">
                <div id="player-cards" class="hand"></div>
                <div class="score-badge" id="player-score-badge">0</div>
            </div>
        </div>

        <div class="interface">
            <div class="bet-area">
                <label>MISE:</label>
                <input type="number" id="bet-input" value="50" min="10">
            </div>
            <div class="button-group">
                <button id="btn-deal" class="btn-main" onclick="startNewGame()">DISTRIBUER</button>
                <button id="btn-hit" class="btn-action" onclick="playerHit()" disabled>TIRER</button>
                <button id="btn-stand" class="btn-action" onclick="playerStand()" disabled>RESTER</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
